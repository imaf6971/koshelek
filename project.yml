name: Koshelek
options:
  bundleIdPrefix: com.imaf6971
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_ANALYZER_NONNULL: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 86384FBV8M
targets:
  Koshelek:
    type: application
    platform: iOS
    sources:
      - Koshelek
    dependencies:
      - target: KoshelekWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imaf6971.koshelek
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Кошелёк
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOG_SYMBOLS: NO
  KoshelekWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - KoshelekWatch
      - Koshelek/Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imaf6971.koshelek.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Кошелёк
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.imaf6971.koshelek
        INFOPLIST_KEY_WKApplication: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "4"
  KoshelekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KoshelekTests
    dependencies:
      - target: Koshelek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imaf6971.koshelek.tests
        GENERATE_INFOPLIST_FILE: YES
  KoshelekUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KoshelekUITests
    dependencies:
      - target: Koshelek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imaf6971.koshelek.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Koshelek:
    build:
      targets:
        Koshelek: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KoshelekTests
        - KoshelekUITests
  KoshelekWatch:
    build:
      targets:
        KoshelekWatch: all
    run:
      config: Debug
